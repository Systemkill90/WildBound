name: Wildbound source checks (no UE required)

on:
  push:
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'Tests/**'
      - '.github/workflows/animal-native-tests.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'Tests/**'
      - '.github/workflows/animal-native-tests.yml'

jobs:
  native-animal-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 animal simulation
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -I Source/Wildbound/Public \
            Tests/Native/AnimalSimulationTests.cpp -o /tmp/wildbound-animal-tests
      - name: Run deterministic simulation tests
        run: /tmp/wildbound-animal-tests

  static-project-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Unreal source layout without compiling UE
        run: python3 Tests/Static/verify_scaffold.py
